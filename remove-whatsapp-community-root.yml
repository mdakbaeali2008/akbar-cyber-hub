name: Remove WhatsApp Community UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-whatsapp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Remove WhatsApp Community button and popup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Your GitHub Pages screenshot shows the site is published
          # from the repository root, so the target is ROOT index.html.
          target = Path("index.html")

          if not target.exists():
              raise SystemExit("Root index.html was not found.")

          html = target.read_text(encoding="utf-8")

          # Remove the permanent floating WhatsApp Community button.
          html = re.sub(
              r'<!-- Permanent button: ALWAYS visible -->.*?<a\s+class=["\']wa-float["\'].*?</a>',
              '',
              html,
              flags=re.I | re.S
          )

          # Remove the first-visit WhatsApp Community popup.
          marker = '<!-- First-visit popup -->'
          start = html.find(marker)
          pos = html.find('<div id="waCommunityPopup"', start if start >= 0 else 0)

          if pos >= 0:
              tag_re = re.compile(r'<div\b[^>]*>|</div\s*>', re.I)
              depth = 0
              end = None

              for match in tag_re.finditer(html, pos):
                  tag = match.group(0).lower()

                  if tag.startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          end = match.end()
                          break

              if end is not None:
                  remove_start = start if start >= 0 else pos
                  html = html[:remove_start] + html[end:]

          # Remove the popup JavaScript using its unique storage key.
          html = re.sub(
              r'<script>\s*\(function\(\)\{.*?akbarCyberHub_waCommunityPopupSeen_v1.*?</script>',
              '',
              html,
              flags=re.I | re.S
          )

          target.write_text(html, encoding="utf-8")
          print("Successfully updated root index.html")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No matching WhatsApp Community code was found."
          else
            git commit -m "Remove WhatsApp Community button and popup"
            git push
          fi
